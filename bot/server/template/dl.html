<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Filename --> · <!-- BrandName --></title><link rel="icon" href="/static/akmovieverse-logo.png"><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><img class="brand-logo" src="/static/akmovieverse-logo.png" alt=""><span><!-- BrandName --></span></a><div class="nav-actions"><button class="btn btn-sm" type="button" data-back>Back</button><a class="btn btn-sm" href="/">Home</a><button class="btn btn-sm icon-btn" type="button" data-theme-toggle>☾</button><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></div></nav></header>
<main class="shell"><section class="panel file-panel"><div class="eyebrow">Telegram file</div><h1 class="file-name"><!-- Filename --></h1><p class="muted"><!-- Size --></p><div class="actions"><!-- DOWNLOAD_START --><a class="btn btn-primary" id="download">Download</a><!-- DOWNLOAD_END --><button class="btn" id="copy">Copy secure link</button><a class="btn" id="telegram">Open Telegram message</a></div><p class="muted">The signed link expires automatically.</p></section><!-- AdSlot --></main>
<script>const here=new URL(location.href),chat=here.pathname.split('/').pop(),id=here.searchParams.get('id'),token=here.searchParams.get('token'),downloadToken='<!-- DownloadToken -->',name=encodeURIComponent(<!-- FilenameJS -->);const stream=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;const download=document.getElementById('download');if(download)download.href=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(downloadToken)}&download=1`;document.getElementById('telegram').href=`https://t.me/<!-- Username -->?start=file_${id}-100${chat}`;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(stream);document.getElementById('copy').textContent='Copied'};</script></body></html>
