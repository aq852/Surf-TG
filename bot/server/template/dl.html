<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Filename --> · Surf-TG</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><span class="brand-mark">S</span><span>Surf-TG</span></a><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></nav></header>
<main class="shell"><section class="panel" style="max-width:720px;margin:auto"><div class="eyebrow">Telegram file</div><h1 class="file-name"><!-- Filename --></h1><p class="muted"><!-- Size --></p><div class="actions"><a class="btn btn-primary" id="download">Download</a><button class="btn" id="copy">Copy secure link</button><a class="btn" id="telegram">Open Telegram message</a></div><p class="muted" style="margin-top:20px">The streaming link is signed and expires automatically.</p></section></main>
<script>const here=new URL(location.href),chat=here.pathname.split('/').pop(),id=here.searchParams.get('id'),token=here.searchParams.get('token'),name=encodeURIComponent('<!-- Filename -->');const stream=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;document.getElementById('download').href=stream;document.getElementById('telegram').href=`https://t.me/<!-- Username -->?start=file_${id}-100${chat}`;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(stream);document.getElementById('copy').textContent='Copied'};</script></body></html>
