<main class="shell"><section class="media-layout public-player"><video class="player" controls playsinline controlsList="nodownload noremoteplayback" poster="<!-- Poster -->" id="player"></video><aside class="panel"><div class="eyebrow">Public preview</div><h1 class="file-name player-title"><!-- Filename --></h1><p class="muted">Streaming is available for this owner-approved file.</p><div class="stack"><a class="btn btn-primary" href="/public/download/<!-- ChatId -->?id=<!-- MessageId -->">Download</a><button class="btn" id="vlc" type="button">Download VLC playlist</button><a class="btn mobile-only" id="mx">Open in MX Player</a><a class="btn" href="/login">Sign in for full library</a></div></aside></section></main><footer class="footer"><div class="shell"><!-- BrandName --> · <!-- SiteCredit --></div></footer><script>const player=document.getElementById('player'),chat='<!-- ChatId -->',id='<!-- MessageId -->',token='<!-- StreamToken -->',externalToken='<!-- ExternalToken -->';const stream=`${location.origin}/${chat}/stream?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;const externalStream=`${location.origin}/${chat}/stream?id=${encodeURIComponent(id)}&token=${encodeURIComponent(externalToken)}`;player.src=stream;document.getElementById('vlc').addEventListener('click',()=>{const blob=new Blob([`#EXTM3U\n#EXTINF:-1,Public stream\n${externalStream}\n`],{type:'audio/x-mpegurl'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='akmovieverse-vlc-playlist.m3u';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)});document.getElementById('mx').href=`intent:${externalStream.replace(/^https?:/, '')}#Intent;scheme=https;action=android.intent.action.VIEW;type=video/*;end`;</script></body></html>
