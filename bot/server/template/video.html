<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Filename --> · Surf-TG</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><span class="brand-mark">S</span><span>Surf-TG</span></a><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></nav></header>
<main class="shell"><div class="media-layout"><video class="player" controls playsinline poster="<!-- Poster -->" id="player"></video><aside class="panel"><div class="eyebrow">Now playing</div><h1 class="file-name" style="font-size:24px"><!-- Filename --></h1><p class="muted"><!-- Size --></p><div class="stack"><button class="btn btn-primary" id="copy">Copy secure link</button><a class="btn" id="download">Download</a><a class="btn" id="vlc">Open in VLC</a><a class="btn" id="mx">Open in MX Player</a><a class="btn" id="telegram">Open Telegram message</a></div><p class="muted" style="font-size:12px;margin-top:18px">This temporary link expires automatically.</p></aside></div></main>
<script>
const here=new URL(location.href),chat=here.pathname.split('/').pop(),id=here.searchParams.get('id'),token=here.searchParams.get('token'),name=encodeURIComponent('<!-- Filename -->');
const stream=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;document.getElementById('player').src=stream;document.getElementById('download').href=stream;document.getElementById('vlc').href=`vlc://${stream}`;document.getElementById('mx').href=`intent:${stream}#Intent;package=com.mxtech.videoplayer.ad;end`;document.getElementById('telegram').href=`https://t.me/<!-- Username -->?start=file_${id}-100${chat}`;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(stream);document.getElementById('copy').textContent='Copied'};
</script></body></html>
