<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Filename --> · <!-- BrandName --></title><link rel="icon" href="/static/akmovieverse-logo.png"><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><img class="brand-logo" src="/static/akmovieverse-logo.png" alt=""><span><!-- BrandName --></span></a><div class="nav-actions"><a class="btn btn-sm" href="/profile">Profile</a><button class="btn btn-sm" type="button" data-back>Back</button><a class="btn btn-sm" href="/">Home</a><button class="btn btn-sm icon-btn" type="button" data-theme-toggle>☾</button><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></div></nav></header>
<main class="shell"><div class="media-layout"><video class="player" controls playsinline poster="<!-- Poster -->" <!-- NativeDownloadControl --> id="player"></video><aside class="panel"><div class="eyebrow">Now playing</div><h1 class="file-name player-title"><!-- Filename --></h1><p class="muted"><!-- Size --></p><div class="stack"><!-- COPY_START --><button class="btn btn-primary" id="copy">Copy secure link</button><!-- COPY_END --><!-- DOWNLOAD_START --><a class="btn" id="download">Download</a><!-- DOWNLOAD_END --><button class="btn" id="vlc">Download VLC playlist</button><a class="btn mobile-only" id="mx">Open in MX Player</a><a class="btn" id="telegram">Open Telegram message</a></div><p class="muted tiny" style="margin-top:18px">Open the downloaded playlist in VLC on desktop. For MKV or unsupported codecs, VLC usually works better than the browser. Temporary links expire automatically.</p></aside></div><!-- AdSlot --></main>
<script>
const here=new URL(location.href),chat=here.pathname.split('/').pop(),id=here.searchParams.get('id'),token=here.searchParams.get('token'),downloadToken='<!-- DownloadToken -->',sharePath='<!-- SharePath -->',name=encodeURIComponent(<!-- FilenameJS -->);
const stream=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;document.getElementById('player').src=stream;const download=document.getElementById('download');if(download)download.href=`${here.origin}/${chat}/${name}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(downloadToken)}&download=1`;document.getElementById('vlc').onclick=()=>{const file=new Blob([`#EXTM3U\n#EXTINF:-1,${decodeURIComponent(name)}\n${stream}\n`],{type:'audio/x-mpegurl'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='akmovieverse-vlc-playlist.m3u';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('mx').href=`intent:${stream}#Intent;package=com.mxtech.videoplayer.ad;end`;document.getElementById('telegram').href=`https://t.me/<!-- Username -->?start=file_${id}-100${chat}`;const copy=document.getElementById('copy');if(copy)copy.onclick=async()=>{await navigator.clipboard.writeText(`${here.origin}${sharePath}`);copy.textContent='Copied'};
</script></body></html>
