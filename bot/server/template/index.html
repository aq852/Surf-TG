<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Title --> · <!-- BrandName --></title><link rel="icon" href="/static/akmovieverse-logo.png"><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><img class="brand-logo" src="/static/akmovieverse-logo.png" alt=""><span><!-- BrandName --></span></a><div class="nav-actions"><span class="badge"><!-- AccountRole --></span><a class="btn btn-sm" href="/profile">Profile</a><a class="btn btn-sm" href="/">Home</a><button class="btn btn-sm" type="button" data-back>Back</button><button class="btn btn-sm icon-btn" type="button" data-theme-toggle title="Toggle light or night mode">☾</button><form action="/reload" method="get"><button class="btn btn-sm" name="chatId" value="<!-- Chat_id -->">Refresh</button></form><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></div></nav></header>
<main class="shell"><section class="hero compact channel-hero"><img class="channel-avatar" src="/api/channel-cover/<!-- Chat_id -->" alt=""><div><div class="eyebrow">Telegram channel</div><h1><!-- Title --></h1><p>Choose a file to play or open in an external player. Premium items are marked clearly.</p></div></section>
<!-- AdSlot -->
<form class="search" action="/search/<!-- Chat_id -->" method="get"><input class="form-control" type="search" name="q" placeholder="Search this channel"><button class="btn btn-primary">Search</button></form>
<!-- ADMIN_START --><details class="panel admin-panel"><summary>Channel appearance</summary><form action="/channel/cover" method="post" enctype="multipart/form-data"><input type="hidden" name="chat_id" value="<!-- Chat_id -->"><label>Channel profile picture (PNG, JPEG, or WebP; max 5 MB)</label><input class="form-control file-input" type="file" name="cover" accept="image/png,image/jpeg,image/webp" required><button class="btn btn-primary" style="margin-top:14px">Upload picture</button></form></details>
<details class="panel admin-panel"><summary>Add selected files to a collection</summary><form action="/send" method="post"><input type="hidden" id="chatId" name="chatId" value="<!-- Chat_id -->"><input type="hidden" id="selectedIds" name="selectedIds"><label for="folderSearch">Find collection</label><input class="form-control" id="folderSearch" onfocus="sendPopupForm()"><label for="folderDropdown">Destination</label><select class="form-select" id="folderDropdown"></select><input type="hidden" id="folderId" name="folderId"><button class="btn btn-primary" id="sendButton" onclick="submitSendForm()" style="margin-top:14px" disabled>Add files</button></form></details>
<details class="panel admin-panel danger-panel"><summary>Index danger zone</summary><p class="muted">Remove every indexed row for this channel. Telegram messages and files are not deleted.</p><form action="/indexed/delete-all" method="post" onsubmit="return confirm('Delete ALL indexed files from this channel? Telegram originals will remain.')"><input type="hidden" name="chat_id" value="<!-- Chat_id -->"><button class="btn btn-danger">Delete all indexed files</button></form></details><!-- ADMIN_END -->
<section class="grid"><!-- Print --></section><nav class="pagination"><a class="page-link" id="prevButton">Previous</a><a class="page-link" id="nextButton">Next</a></nav></main><footer class="footer"><div class="shell"><!-- BrandName --> · <!-- SiteCredit --></div></footer></body></html>
