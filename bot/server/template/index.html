<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!-- Title --> · Surf-TG</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body>
<header class="topbar"><nav class="shell nav"><a class="brand" href="/"><span class="brand-mark">S</span><span>Surf-TG</span></a><div class="nav-actions"><form action="/reload" method="get" class="admin-only"><button class="btn btn-sm" name="chatId" value="<!-- Chat_id -->">Refresh</button></form><form action="/logout" method="post"><button class="btn btn-secondary btn-sm">Sign out</button></form></div></nav></header>
<main class="shell"><section class="hero"><div><div class="eyebrow">Telegram channel</div><h1><!-- Title --></h1><p>Choose a file to play, download, or open in an external player.</p></div></section>
<form class="search" action="/search/<!-- Chat_id -->" method="get"><input class="form-control" type="search" name="q" placeholder="Search this channel"><button class="btn btn-primary">Search</button></form>
<details class="panel admin-panel admin-only"><summary>Add selected files to a collection</summary><form action="/send" method="post"><input type="hidden" id="chatId" name="chatId" value="<!-- Chat_id -->"><input type="hidden" id="selectedIds" name="selectedIds"><label for="folderSearch">Find collection</label><input class="form-control" id="folderSearch" onfocus="sendPopupForm()"><label for="folderDropdown">Destination</label><select class="form-select" id="folderDropdown"></select><input type="hidden" id="folderId" name="folderId"><button class="btn btn-primary" id="sendButton" onclick="submitSendForm()" style="margin-top:14px" disabled>Add files</button></form></details>
<section class="grid"><!-- Print --></section><nav class="pagination"><a class="page-link" id="prevButton">Previous</a><a class="page-link" id="nextButton">Next</a></nav></main><footer class="footer"><div class="shell">Surf-TG 2.0</div></footer></body></html>
